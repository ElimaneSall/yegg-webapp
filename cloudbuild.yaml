# ==========================================
# Build et déploiement Cloud Run + Cloud SQL
# ==========================================

steps:
  # Étape 1 : Build Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yegg-app:latest', '.']

  # Étape 2 : Push Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yegg-app:latest']

  # Étape 3 : Déployer sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'yegg-app',
        '--image', 'gcr.io/$PROJECT_ID/yegg-app:latest',
        '--platform', 'managed',
        '--region', '${_DEPLOY_REGION}',
        '--allow-unauthenticated',
        '--port', '8080',
        '--add-cloudsql-instances', '${_CLOUDSQL_INSTANCE}',
        '--set-env-vars', 'SPRING_DATASOURCE_URL=${_SPRING_DATASOURCE_URL}',
        '--set-env-vars', 'SPRING_DATASOURCE_USERNAME=${_SPRING_DATASOURCE_USERNAME}',
        '--set-env-vars', 'SPRING_DATASOURCE_PASSWORD=${_SPRING_DATASOURCE_PASSWORD}'
      ]

# Image finale
images:
  - 'gcr.io/$PROJECT_ID/yegg-app:latest'

# Substitutions (sécurisées via Secret Manager)
substitutions:
  _DEPLOY_REGION: ''
  _CLOUDSQL_INSTANCE: ''
  _SPRING_DATASOURCE_URL: ''
  _SPRING_DATASOURCE_USERNAME: 'root'
  _SPRING_DATASOURCE_PASSWORD: 'YourDbPassword'

# Timeout du build
timeout: '1200s'

# Logs Cloud Logging uniquement
options:
  logging: CLOUD_LOGGING_ONLY
