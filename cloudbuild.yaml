# cloudbuild.yaml
# Build et déploiement automatique sur Cloud Run avec Cloud SQL (variables sécurisées)

steps:
  # Étape 1 : Build de l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/yegg-app:latest',
        '.'
      ]

  # Étape 2 : Pousser l'image vers Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/yegg-app:latest'
      ]

  # Étape 3 : Déployer sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'yegg-app',
        '--image', 'gcr.io/$PROJECT_ID/yegg-app:latest',
        '--platform', 'managed',
        '--region', '${_DEPLOY_REGION}',
        '--allow-unauthenticated',
        '--port', '8080',
        '--add-cloudsql-instances', '${_CLOUDSQL_INSTANCE}',
        '--set-env-vars', 'SPRING_DATASOURCE_URL=${_SPRING_DATASOURCE_URL}',
        '--set-env-vars', 'SPRING_DATASOURCE_USERNAME=${_SPRING_DATASOURCE_USERNAME}',
        '--set-env-vars', 'SPRING_DATASOURCE_PASSWORD=${_SPRING_DATASOURCE_PASSWORD}'
      ]

images:
  - 'gcr.io/$PROJECT_ID/yegg-app:latest'

# Substitutions pour les variables sensibles (à passer via Secret Manager)
substitutions:
  _CLOUDSQL_INSTANCE: 'INSTANCE'
  _SPRING_DATASOURCE_URL: 'URL'
  _SPRING_DATASOURCE_USERNAME: "USERNAME"
  _SPRING_DATASOURCE_PASSWORD: "PASSWORD"

# Timeout du build
timeout: '1200s'
options:
  logging: NONE
